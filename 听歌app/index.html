<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>听歌 · 生活内容管理</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/home" aria-label="听歌首页">
          <span class="brand-mark" aria-hidden="true">♪</span>
          <span>听歌<span class="brand-dot">.</span></span>
        </a>
        <div class="sidebar-label">工作区</div>
        <nav class="primary-nav">
          <a class="nav-link" href="#/home" data-route="home"><span class="nav-icon">⌂</span><span>首页总览</span></a>
          <a class="nav-link" href="#/songs" data-route="songs"><span class="nav-icon">♫</span><span>今天的热门歌曲</span></a>
          <a class="nav-link" href="#/videos" data-route="videos"><span class="nav-icon">▷</span><span>热门视频</span></a>
          <a class="nav-link" href="#/paths" data-route="paths"><span class="nav-icon">▤</span><span>保存路径</span></a>
          <a class="nav-link" href="#/history" data-route="history"><span class="nav-icon">◷</span><span>过去流行单曲</span></a>
        </nav>
        <div class="sidebar-footer">
          <a class="nav-link" href="#/settings" data-route="settings"><span class="nav-icon">⚙</span><span>数据与设置</span></a>
          <div class="local-note"><span class="status-dot"></span>仅保存在此浏览器</div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb">听歌 <span>/</span> <strong id="page-breadcrumb">首页总览</strong></div>
          <div class="topbar-status"><span class="status-dot"></span>本机模式</div>
        </header>
        <section id="app" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
        <dialog id="detail-dialog" class="detail-dialog">
          <div id="detail-body"></div>
          <div class="dialog-actions"><button class="button" data-action="close-detail">关闭</button></div>
        </dialog>
        <dialog id="media-dialog" class="media-dialog">
          <div id="media-dialog-body"></div>
        </dialog>
        <script src="src/store.js"></script>
        <script src="src/catalog.js"></script>
        <script src="src/backup.js"></script>
    <script src="src/sources.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
